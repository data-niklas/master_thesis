name: Compile, Upload and Release Typst Documents
on:
  push:
    branches:
    - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Compile Typst Files
      uses: ammar-ahmed22/compile-typst-action@v1
      with:
        source_paths: 'main.typ'
        output_paths: 'release/Masterthesis.pdf'
    - name: Commit compiled PDFs
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: '[continuous deployment]: Compiled Typst to PDF'
