<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Table viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/loader.js"></script>
</head>

<body>
    <h1>Interactive Data Viewer</h1>
    <h2 id="tables">Tables</h2>
    <h2 id="code">Code</h2>
    <style>
        body {
            background: #eaeaea;
        }

        body>div {
            margin-bottom: 60pt;
        }

        .header {
            display: flex;
            flex-direction: row;
            align-items: baseline;
        }

        #container {}
    </style>
    <script>
        function insertAfter(newNode, referenceNode) {
            referenceNode.parentNode.insertBefore(newNode, referenceNode.nextSibling);
        }

        function loadMonacoEditor() {
            require.config({
                paths: {
                    'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs'
                }
            });
            window.MonacoEnvironment = {
                getWorkerUrl: () => proxy
            };

            let proxy = URL.createObjectURL(new Blob([`
	self.MonacoEnvironment = {
		baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min'
	};
	importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/base/worker/workerMain.js');
`], {
                type: 'text/javascript'
            }));

        }


        
        function createPlugin(fileName) {
            return () => {
                return gridjs.h("div", {
                    class: "header"
                }, [
                    gridjs.h("h2", {}, fileName.replace('.csv', '')),
                    gridjs.h("span", {
                        style: "flex-grow: 1"
                    }),
                    gridjs.h("a", {
                        href: `./assets/tables/${fileName}`
                    }, "Download")
                ]);
            }
        }
        loadMonacoEditor();
        let tables_header = document.getElementById('tables');
        let code_header = document.getElementById('code');
        let table_finished = false;
        let code_finished = false;
        fetch('./assets/tables/index.txt')
            .then(response => response.text())
            .then(text => {
                let files = text.split('\n').filter(file => file.length > 0);
                let processed = 0;
                files.forEach(file => {
                    fetch(`./assets/tables/${file}`)
                        .then(response => response.text())
                        .then(text => {
                            let t = text.split('\n').filter(row => row.length > 0).map(row => row.split(','));
                            let elem = document.createElement("div");
                            elem.id = file.replace('.csv', '');
                            insertAfter(elem, tables_header);

                            let table = new gridjs.Grid({
                                columns: t.shift(),
                                data: t,
                                search: true,
                                sort: true,
                                resizable: true
                            });
                            table.render(elem);
                            table.plugin.add({
                                id: 'header',
                                component: createPlugin(file),
                                position: gridjs.PluginPosition.Header
                            });
                            processed++;
                            if (processed === files.length) {
                                table_finished = true;
                            }
                            if (table_finished && code_finished) {
                                // jump to id if url hash is present and content is loaded
                                if (window.location.hash) {
                                    let elem = document.getElementById(window.location.hash.replace('#', ''));
                                    if (elem) {
                                        elem.scrollIntoView({
                                            behavior: 'smooth'
                                        });
                                    }
                                }
                            }

                        });
                });
            });
        const LANGUAGE_MAP = {
            'py': 'python',
            'json': 'json',
        };
        fetch('./assets/code/index.txt')
            .then(response => response.text())
            .then(text => {
                let files = text.split('\n').filter(file => file.length > 0);
                let processed = 0;
                files.forEach(file => {
                    fetch(`./assets/code/${file}`)
                        .then(response => response.text())
                        .then(code => {
                            require(["vs/editor/editor.main"], function() {
                                let language_extension = file.split('.').pop();
                                let language = LANGUAGE_MAP[language_extension] || language_extension;
                                let container = document.createElement('div');
                                container.id = file.split('.').shift();
                                insertAfter(container, code_header);
                                let label = document.createElement('h2');
                                label.innerHTML = file;
                                insertAfter(label, code_header);
                                let editor = monaco.editor.create(container, {
                                    value: code,
                                    language: language,
                                    theme: 'vs-dark'
                                });
                                const contentHeight = Math.min(Math.max(editor.getModel().getLineCount(), 7), 60) * 19;
                                container.style.height = `${contentHeight}px`;
                                editor.layout();
                                processed++;
                                if (processed === files.length) {
                                    code_finished = true;
                                }
                                if (table_finished && code_finished) {
                                    // jump to id if url hash is present and content is loaded
                                    if (window.location.hash) {
                                        let elem = document.getElementById(window.location.hash.replace('#', ''));
                                        if (elem) {
                                            elem.scrollIntoView({
                                                behavior: 'smooth'
                                            });
                                        }
                                    }
                                }
                            });
                        });
                });
            });
    </script>
</body>

</html>
