<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
</head>

<body>
    <h1>Interactive Data Viewer</h1>
        <style>
            body {
                background: #eaeaea;
            }
            body > div {
                margin: 0 auto 60pt auto;
            }
            .header {
                display: flex;
                flex-direction: row;
                align-items: baseline;
            }
        </style>
    <script>
        function createPlugin(fileName){
            return () => {
                return gridjs.h("div", {
                    class: "header"
                }, [
                    gridjs.h("h2", {}, fileName.replace('.csv', '')),
                    gridjs.h("span", {
                        style: "flex-grow: 1"
                    }),
                    gridjs.h("a", {
                        href: `./assets/tables/${fileName}`
                    }, "Download")
                ]);
            }
        }
        fetch('./assets/tables/index.txt')
            .then(response => response.text())
            .then(text => {
                let files = text.split('\n').filter(file => file.length > 0);
                files.forEach(file => {
                    fetch(`./assets/tables/${file}`)
                        .then(response => response.text())
                        .then(text => {
                            let t = text.split('\n').filter(row => row.length > 0).map(row => row.split(','));
                            let elem = document.createElement("div");
                            elem.id = file.replace('.csv', '');
                            document.body.appendChild(elem);
                            
                            let table = new gridjs.Grid({
                                columns: t.shift(),
                                data: t,
                                search: true,
                                sort: true,
                                resizable: true
                            });
                            table.render(elem);
                            table.plugin.add({
                                id: 'header',
                                component: createPlugin(file),
                                position: gridjs.PluginPosition.Header
                            });
                        });
                });
            });
        // jump to id if url hash is present and content is loaded
        setTimeout(() => {
            if (window.location.hash) {
                let elem = document.getElementById(window.location.hash.replace('#', ''));
                if (elem) {
                    elem.scrollIntoView({behavior: 'smooth'});
                }
            }
        }, 1500); 
    </script>
</body>

</html>
