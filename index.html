<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table viewer</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
</head>

<body>
    <script>
        // load the list of csv files from /assets/tables/index.txt
        // create a table for each csv file and append it to the body
        // call let table = new DataTable('#myTable'); for each table
        fetch('./assets/tables/index.txt')
            .then(response => response.text())
            .then(text => {
                let files = text.split('\n').filter(file => file.length > 0);
                files.forEach(file => {
                    fetch(`./assets/tables/${file}`)
                        .then(response => response.text())
                        .then(text => {
                            let table = document.createElement('table');
                            let id = file.split('.')[0];
                            table.id = id;
                            body.appendChild(table);
                            let data = text.split('\n').map(row => row.split(','));
                            let dataTable = new DataTable(`#${table.id}`, data);
                        });
                });
            });
    </script>
</body>

</html>
